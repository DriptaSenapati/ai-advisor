# Deployed shape: pulls the image built by CI (ghcr.io/driptasenapati/ai-advisor)
# instead of building locally. No uploads volume — statement PDFs and avatars
# both go to S3 (STORAGE_DRIVER=s3 in .env.production), so the API and worker
# no longer need a shared filesystem at all.

services:
  redis:
    image: redis:alpine
    container_name: ai_advisor_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  api:
    image: ghcr.io/driptasenapati/ai-advisor:latest
    container_name: ai_advisor_api
    command: node build/api/server.js
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 120s
      start_interval: 2s
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: ghcr.io/driptasenapati/ai-advisor:latest
    container_name: ai_advisor_worker
    command: node build/worker.js
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
